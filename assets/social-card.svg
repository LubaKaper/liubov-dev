<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Luba Kaper, software engineer in New York</title>
  <desc id="desc">Cream, black, and red editorial poster introducing product-minded software engineer Luba Kaper.</desc>
  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#DAD7CF"/>
  <path d="M700 -10H1220V188L642 112L700 -10Z" fill="#D7261E"/>
  <circle cx="1110" cy="515" r="208" fill="#D7261E" style="mix-blend-mode:multiply"/>

  <g transform="rotate(-5 322 310)">
    <text x="60" y="258" fill="#141414" font-family="Arial Black, Arial, sans-serif" font-size="178" font-weight="900" letter-spacing="-13">LIU</text>
    <text x="60" y="426" fill="#141414" font-family="Arial Black, Arial, sans-serif" font-size="178" font-weight="900" letter-spacing="-13">BOV</text>
  </g>

  <g transform="rotate(-7 920 85)">
    <text x="805" y="79" fill="white" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900">Поехали!</text>
    <text x="944" y="108" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">“LET’S GO”</text>
  </g>

  <g transform="rotate(1.5 585 284)">
    <rect x="560" y="274" width="535" height="182" fill="#141414"/>
    <text x="596" y="328" fill="#EDEAE2" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">SOFTWARE ENGINEER · NEW YORK</text>
    <text x="596" y="374" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700">Product-minded engineering.</text>
    <text x="596" y="410" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700">AI where it earns its place.</text>
  </g>

  <path d="M58 540H535" stroke="#141414" stroke-width="4"/>
  <text x="58" y="578" fill="#3B3935" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">LUBA KAPER · LIUBOV-DEV.VERCEL.APP</text>
  <rect width="1200" height="630" filter="url(#noise)" opacity="0.42" style="mix-blend-mode:multiply"/>
</svg>
