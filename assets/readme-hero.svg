<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Luba Kaper, software engineer in New York</title>
  <desc id="desc">A cream poster with bold black lettering, a red diagonal shape, and the Russian phrase Poekhali, meaning Let's go.</desc>
  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="520" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="520" fill="#DAD7CF"/>
    <path d="M708 2L1263 2L1263 184L643 115L708 2Z" fill="#D7261E"/>
    <circle cx="1092" cy="415" r="172" fill="#D7261E" style="mix-blend-mode:multiply"/>

    <g transform="rotate(-5 380 275)">
      <text x="62" y="236" fill="#141414" font-family="Arial Black, Arial, sans-serif" font-size="168" font-weight="900" letter-spacing="-12">LIU</text>
      <text x="62" y="394" fill="#141414" font-family="Arial Black, Arial, sans-serif" font-size="168" font-weight="900" letter-spacing="-12">BOV</text>
    </g>

    <g transform="rotate(-7 922 81)">
      <text x="800" y="75" fill="white" font-family="Arial Black, Arial, sans-serif" font-size="33" font-weight="900">Поехали!</text>
      <text x="936" y="101" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">“LET’S GO”</text>
    </g>

    <rect x="550" y="247" width="510" height="154" fill="#141414" transform="rotate(1.5 550 247)"/>
    <text x="588" y="298" fill="#EDEAE2" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">SOFTWARE ENGINEER · NEW YORK</text>
    <text x="588" y="339" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="700">Product-minded engineering.</text>
    <text x="588" y="371" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="700">AI where it earns its place.</text>

    <path d="M54 460H524" stroke="#141414" stroke-width="4"/>
    <text x="54" y="491" fill="#3B3935" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">DESIGNED + BUILT BY LUBA KAPER</text>

    <rect width="1200" height="520" filter="url(#noise)" opacity="0.42" style="mix-blend-mode:multiply"/>
  </g>
</svg>
